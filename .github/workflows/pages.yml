# Publishes the site to GitHub Pages on every push to main, with the js/ files joined into one
# (see tools/build.py). Needs Settings → Pages → Source: "GitHub Actions".
# Follows GitHub's starter workflow (actions/starter-workflows pages/static.yml) plus the build step.
name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One publish at a time; a running one is never cancelled halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build (join js/ into one file)
        run: python3 tools/build.py
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
