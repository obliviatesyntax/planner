# Publishes the site to GitHub Pages on every push to main, with the js/ files joined into one
# (see tools/build.py). Needs Settings → Pages → Source: "GitHub Actions".
#
# Build and deploy are separate jobs (like GitHub's starter workflows for built sites), so the
# uploaded site is complete before the deploy looks for it. GitHub's deploy step sometimes fails
# for no reason of ours ("try again later" / "artifact not found"), so it gets a second attempt.
name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One publish at a time; a running one is never cancelled halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build (join js/ into one file)
        run: python3 tools/build.py
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.retry.outputs.page_url || steps.first.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: first
        continue-on-error: true
        uses: actions/deploy-pages@v5
      - name: Wait before trying again
        if: steps.first.outcome == 'failure'
        run: sleep 30
      - name: Deploy to GitHub Pages (second attempt)
        id: retry
        if: steps.first.outcome == 'failure'
        uses: actions/deploy-pages@v5
