<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Planner</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%234f46e5'/%3E%3Crect x='13' y='17' width='38' height='34' rx='6' fill='none' stroke='white' stroke-width='5'/%3E%3Cpath d='M13 27h38' stroke='white' stroke-width='5'/%3E%3Cpath d='M24 39l5 5 10-11' fill='none' stroke='white' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Shown when nobody is signed in (see js/auth.js). -->
  <section id="signin" class="signin" hidden>
    <div class="signin-card">
      <h1>Planner</h1>
      <form id="signin-form" class="signin-step">
        <input id="signin-email" type="email" required placeholder="you@example.com" autocomplete="email">
        <input id="signin-password" type="password" placeholder="Password" autocomplete="current-password">
        <button type="submit" value="signin" class="primary">Sign in</button>
        <button type="submit" value="signup">Create account</button>
        <div class="or"><span>or, without a password</span></div>
        <button type="submit" value="code" class="link-btn">Email me a sign-in code</button>
      </form>
      <form id="code-form" class="signin-step" hidden>
        <input id="code-input" required inputmode="numeric" autocomplete="one-time-code"
               pattern="[0-9]{6,10}" maxlength="10" placeholder="123456" class="code-input">
        <button type="submit" class="primary">Sign in</button>
        <button type="button" id="code-back" class="link-btn">Use a different email</button>
      </form>
      <form id="finish-form" class="signin-step" hidden>
        <input id="finish-password" type="password" required minlength="6" placeholder="Password (6+ characters)" autocomplete="new-password">
        <button type="submit" class="primary">Finish creating account</button>
        <button type="button" id="finish-skip" class="link-btn">Skip, continue without a password</button>
      </form>
      <p id="signin-message" class="muted"></p>
    </div>
  </section>

  <div id="app" hidden>
  <header class="topbar">
    <div class="brand"><svg class="logo" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="15" fill="#4f46e5"/><rect x="13" y="17" width="38" height="34" rx="6" fill="none" stroke="#fff" stroke-width="5"/><path d="M13 27h38" stroke="#fff" stroke-width="5"/><path d="M24 39l5 5 10-11" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>Planner <span id="today-label" class="muted"></span></div>
    <div class="account">
      <span id="user-email" class="muted"></span>
      <button type="button" id="settings-btn" title="Settings">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        Settings
      </button>
      <button type="button" id="signout-btn">Sign out</button>
    </div>
  </header>

  <main id="main-view">
    <!-- Label filter chips: All · Work #w · Personal #p · + (see js/labels.js) -->
    <div id="labels-bar" class="labels-bar"></div>

    <!-- Quick add: type and press Enter. A day/time puts it on the plan, @list or nothing puts it in a list.
         See app.js (form submit) and when.js. -->
    <form id="quick-add" class="quick-add" autocomplete="off">
      <input id="qa-title" placeholder="Add a task…   “Dentist tomorrow 5pm p1 #p” goes on the plan · “Renew passport @weekly” goes to a list   (press N)">
      <button type="button" id="mic-btn" class="mic-btn" title="Speak a task">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0"/><path d="M12 17v4"/></svg>
      </button>
      <button type="submit" class="primary">Add</button>
    </form>

    <!-- Top: what you've committed to (js/planner.js). Bottom: your lists (js/lists.js). -->
    <section id="planner" class="section"></section>
    <section id="lists" class="section"></section>
  </main>

  <footer class="footer">
    <span class="muted"><b>today 5pm</b>, <b>tomorrow</b>, <b>fri 6-7pm</b> → plan · <b>@listName</b> → list · <b>p1 p2 p3</b> priority · <b>#p</b> label · click the calendar to add at a time · drag to “Done today” to complete · double-click to rename</span>
    <span class="spacer"></span>
    <button type="button" id="export-btn">Export backup</button>
    <label class="file-btn">Import backup<input type="file" id="import-input" accept="application/json" hidden></label>
  </footer>

  </div>

  <!-- Settings window, filled in by js/settings.js -->
  <dialog id="settings-dialog"></dialog>

  <div id="toast" class="toast" hidden></div>

  <!-- Plain scripts, loaded in order. No build step. -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/when.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/store.js"></script>
  <script src="js/tasks.js"></script>
  <script src="js/labels.js"></script>
  <script src="js/cards.js"></script>
  <script src="js/planner.js"></script>
  <script src="js/dnd.js"></script>
  <script src="js/lists.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/app.js"></script>
  <script src="js/voice.js"></script>
</body>
</html>
